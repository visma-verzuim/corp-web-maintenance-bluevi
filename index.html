  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background: radial-gradient(1100px 540px at 50% -10%, rgba(0,7,68,.07), rgba(0,0,0,0) 70%), var(--bg);
    display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:32px 20px; -webkit-font-smoothing:antialiased; }
  .card{ position:relative; width:100%; max-width:540px; background:#fff; border:1px solid var(--line);
    border-radius:20px; box-shadow:0 26px 64px rgba(0,7,68,.12); padding:48px 44px 40px; text-align:center; overflow:hidden; }
  .card::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--c1),var(--c2)); }
  /* fixed logo slot -> equal header height + identical spacing on both pages */
  .logo-slot{ height:88px; display:flex; align-items:center; justify-content:center; margin:6px auto 28px; }
  .logo{ display:block; height:82px; width:auto; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
  .cog{ width:15px; height:15px; display:block; flex:0 0 auto; animation:spin 5.5s linear infinite; transform-origin:50% 50%; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  h1{ margin:0 0 16px; font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:clamp(27px,5.6vw,35px); line-height:1.12; font-weight:700; color:var(--c1); letter-spacing:-.015em; }
  p.lead{ margin:0 auto; max-width:42ch; font-size:16.5px; line-height:1.62; color:var(--muted); }
  .window{ margin:30px auto 0; padding-top:24px; border-top:1px solid var(--line); font-size:14.5px; color:var(--muted); line-height:1.6; }
  .window b{ color:var(--ink); font-weight:600; }
  @media (prefers-reduced-motion:reduce){ .cog{ animation:none; } }
  @media (max-width:440px){
    .card{ padding:38px 24px 32px; }
    .logo-slot{ height:72px; margin-bottom:22px; }
    .logo{ height:65px; }
  }
</style>
</head>
